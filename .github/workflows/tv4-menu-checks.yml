name: DAODES TV4 menu checks

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/Console/Commands/ConfigureOrganizationTwoTvFourMenu.php'
      - 'tests/Unit/ConfigureOrganizationTwoTvFourMenuTest.php'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/tv4-menu-checks.yml'

permissions:
  contents: read

jobs:
  tv4-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_mysql, pdo_sqlite, tokenizer, xml, zip
          coverage: none

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate application key
        run: php artisan key:generate --force

      - name: PHP syntax
        run: |
          php -l app/Console/Commands/ConfigureOrganizationTwoTvFourMenu.php
          php -l tests/Unit/ConfigureOrganizationTwoTvFourMenuTest.php

      - name: Run TV4 menu unit test
        run: vendor/bin/phpunit tests/Unit/ConfigureOrganizationTwoTvFourMenuTest.php
